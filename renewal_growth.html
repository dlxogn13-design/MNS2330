<!DOCTYPE html>
<html lang="ko">

<head>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📈 영업M 성장 리포트</title>

<link rel="stylesheet" href="renewal_growth.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="page">

<header class="top-header">

<div class="title-area">

<h1>📈 영업M 성장 리포트</h1>

<p>
Renewal Management System
</p>

</div>

<div class="top-buttons">

<button
id="btnHome"
class="btn btn-home">

🏠 홈가기

</button>

<button
id="btnRefresh"
class="btn btn-refresh">

🔄 새로고침

</button>

</div>

</header>



<section class="search-box">

<div class="search-item">

<label>

센터

</label>

<select id="centerSelect">

<option value="">전체센터</option>

<option>서대문</option>
<option>의정부</option>
<option>고양</option>
<option>구리</option>
<option>노원</option>
<option>광진</option>
<option>강릉</option>
<option>원주</option>
<option>춘천</option>

</select>

</div>
<div class="search-item">

<label>

기간

</label>

<select id="periodSelect">

<option value="today">오늘</option>
<option value="week">이번주</option>
<option value="month" selected>이번달</option>

</select>

</div>

<div class="search-item">

<label>

성명 검색

</label>

<input
type="text"
id="searchName"
placeholder="성명을 입력하세요">

</div>

</section>



<section class="report-section">

<div class="section-title">

📈 영업M 성장 리포트

</div>

<div class="table-wrap">

<table
class="growth-table"
id="growthTable">

<thead>

<tr>

<th>순위</th>
<th>담당M</th>
<th>권매</th>
<th>전달</th>
<th>성공</th>
<th>성공률</th>

</tr>

</thead>

<tbody id="growthBody">

<!-- JS 생성 -->

</tbody>

<tfoot>

<tr class="total-row">

<td colspan="3">

합계

</td>

<td id="sumRenewal">0</td>

<td id="sumTransfer">0</td>

<td id="sumSuccess">0</td>

<td id="sumRate">0.0%</td>

</tr>

</tfoot>

</table>

</div>

</section>
<section class="ai-section">

<div class="section-title">

🤖 AI 분석

</div>

<div class="ai-card">

<ul>

<li id="aiTop">🏆 오늘 우수 담당자를 분석합니다.</li>

<li id="aiCenter">📊 센터 평균을 계산합니다.</li>

<li id="aiImprove">📈 개선 대상을 분석합니다.</li>

<li id="aiCompare">📅 전일 대비 기능은 V0.4에서 추가됩니다.</li>

</ul>

</div>

</section>

<footer>

Renewal Management System V0.3

</footer>

</div>

<script src="renewal_growth.js"></script>

</body>
</html>
