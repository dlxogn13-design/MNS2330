<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>강북도매 유/무선 실적</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- 🔥 여기 추가 -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#efefef;
    padding:6px;
    margin:0;
    font-weight:700;
}

.topbar{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    background:#111827;
    color:white;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
}

.centerGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:12px;
}

.centerGrid button{
    background:#1d4ed8;
    font-size:18px;
    padding:12px;
}

.board-wrap{
    background:white;
    border:1px solid #cfcfcf;
}

.board-title{
    background:black;
    color:white;
    text-align:center;
    font-size:34px;
    padding:10px;
    font-weight:900;
}

.board-date{
    text-align:center;
    font-size:26px;
    padding:10px 0;
    font-weight:900;
}

.section-title{
    background:black;
    color:white;
    text-align:center;
    font-size:28px;
    padding:8px;
    margin-top:6px;
    font-weight:900;
}

.status-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.status-table th{
    background:black;
    color:white;
    border:1px solid #999;
    padding:8px 4px;
    font-size:22px;
}

.status-table td{
    border:1px solid #cfcfcf;
    padding:6px 4px;
    text-align:center;
    font-size:22px;
    background:#f8f8f8;
}

.rankTop{
    background:#001eff !important;
    color:white;
    font-weight:900;
}

.rankLow{
    background:#ff1a1a !important;
    color:white;
    font-weight:900;
}

.groupRow td{
    background:#d9e6ec !important;
    font-weight:900;
}

.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    width:420px;
    padding:20px;
    border-radius:12px;
    display:none;
    z-index:999;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.popup h3{
    font-size:28px;
    text-align:center;
}

.popup input{
    width:100%;
    padding:12px;
    margin:8px 0;
    font-size:20px;
    box-sizing:border-box;
}

.popup button{
    width:100%;
    margin-top:10px;
}

@media(max-width:768px){

    .board-title{
        font-size:24px;
    }

    .section-title{
        font-size:20px;
    }

    .status-table th,
    .status-table td{
        font-size:14px;
        padding:4px;
    }

    button{
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="topbar">
<button onclick="location.href='index.html'">메인가기</button>
<button onclick="location.reload()">새로고침</button>
<button onclick="adminReset()">초기화</button>

<!-- 🔥 여기 추가 -->
<button onclick="sendTelegram()">📤 실적방 전송</button>

</div>

<div class="centerGrid" id="btns"></div>

<h2>강북도매 유/무선 실적</h2>
<h3 id="titleTime"></h3>

<!-- 🔥 여기 시작 -->
<div id="captureArea">

<div class="board-wrap">

<div class="board-title">
강북도매 실적 현황
</div>

<div class="board-date" id="titleTime"></div>

<!-- 무선 -->
<div class="section-title">
무선 실적
</div>

<table class="status-table" id="wirelessTbl">
<thead>
<tr>
<th>센터</th>
<th>목표</th>
<th>실적</th>
<th>달성율</th>
<th>순위</th>
<th>증분</th>
<th>MNP</th>
<th>비중</th>
<th>U-MNP</th>
</tr>
</thead>
<tbody></tbody>
</table>

<!-- 유선 -->
<div class="section-title">
유선 실적
</div>

<table class="status-table" id="lineTbl">
<thead>
<tr>
<th>센터</th>
<th>목표</th>
<th>실적</th>
<th>달성율</th>
<th>순위</th>
<th>증분</th>
<th>약정</th>
<th>증분</th>
<th>(순+약)계</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<h3 class="track-title">진행 트랙</h3>

<div class="track-label">무선</div>
<div class="track">
<div class="finish"></div>
<div id="rw" class="runner"><span id="pw"></span>🏃‍➡️</div>
</div>

<div class="track-label">유선</div>
<div class="track">
<div class="finish"></div>
<div id="rl" class="runner"><span id="pl"></span>🏃‍➡️</div>
</div>

</div>
<!-- 🔥 여기 끝 -->

<div class="popup" id="popup">
<h3 id="pTitle"></h3>
<input id="w" placeholder="무선">
<input id="m" placeholder="MNP">
<input id="l" placeholder="유선">
<input id="r" placeholder="약갱">
<br>
<button onclick="save()">저장</button>
<button onclick="popup.style.display='none'">닫기</button>
</div>

<script>
const centers=["서대문","의정부","고양","구리","노원","광진","강릉","원주","춘천"]

let cache={},targets={},cur=""
let targetLoaded=false

firebase.initializeApp({
 databaseURL:"https://sales-dashboard-e7a79-default-rtdb.firebaseio.com"
})
const db=firebase.database()

// 🔥 여기 추가
const ADMIN_PW = "2330"

function pct(a,b){
 if(!a||!b) return "-"
 let v=a/b*100
 return v>=100?Math.round(v):(Math.round(v*10)/10)
}

function ratio(a,b){
 if(!a||!b) return 0
 return Math.round(a/b*100)
}

function signal(ts){
 if(!ts) return "red"
 let diff=(Date.now()-ts)/60000
 if(diff<60) return "green"
 if(diff<120) return "yellow"
 return "red"
}

function trackPos(p){
 if(p<=100) return (p/100)*66
 return 66+Math.min(p-100,100)/100*34
}

function updateTime(){
 let n=new Date()
 titleTime.innerText=`${n.getMonth()+1}월 ${n.getDate()}일 ${n.getHours()}시 기준`
}

function adminReset(){
 let pw=prompt("비밀번호")
 if(pw!=="2330") return
 if(confirm("입력값 초기화?")){
  centers.forEach(c=>{
   db.ref("c_"+c).update({w:0,m:0,l:0,r:0,prevW:0,prevL:0,ts:0})
  })
 }
}

function getData(c){return cache["c_"+c]||{}}

function renderBtns(){
 let d=document.getElementById("btns")
 d.innerHTML=""
 centers.forEach(c=>{
  d.innerHTML+=`<button onclick="openCenter('${c}')">${c}</button>`
 })
}

function openCenter(c){
 cur=c
 let s=getData(c)
 w.value=s.w||""
 m.value=s.m||""
 l.value=s.l||""
 r.value=s.r||""
 pTitle.innerText=c
 popup.style.display="block"
}

function render(){


  let wBody=document.querySelector("#wirelessTbl tbody")
 let lBody=document.querySelector("#lineTbl tbody")

 wBody.innerHTML=""
 lBody.innerHTML=""

 let wRank=[...centers].map(c=>{
  let s=getData(c),t=targets[c]||{}
  return {c,v:(s.w||0)/(t.w||1)}
 }).sort((a,b)=>b.v-a.v)

 let lRank=[...centers].map(c=>{
  let s=getData(c),t=targets[c]||{}
  return {c,v:(s.l||0)/(t.l||1)}
 }).sort((a,b)=>b.v-a.v)

 let sum={w:0,l:0,tw:0,tl:0}

 centers.forEach(c=>{
  let s=getData(c),t=targets[c]||{}
  let wr=wRank.findIndex(x=>x.c==c)+1
  let lr=lRank.findIndex(x=>x.c==c)+1

  wBody.innerHTML += `
<tr>
<td>${c}</td>
<td>${t.w||0}</td>
<td>${s.w||0}</td>
<td>${pct(s.w,t.w)}%</td>
<td class="${wr<=2?'rankTop':wr>=8?'rankLow':''}">${wr}</td>
<td>${(s.w||0)-(s.prevW||0)}</td>
<td>${s.m||0}</td>
<td>${ratio(s.m,s.w)}%</td>
<td>${s.m||0}</td>
</tr>
`

lBody.innerHTML += `
<tr>
<td>${c}</td>
<td>${t.l||0}</td>
<td>${s.l||0}</td>
<td>${pct(s.l,t.l)}%</td>
<td class="${lr<=2?'rankTop':lr>=8?'rankLow':''}">${lr}</td>
<td>${(s.l||0)-(s.prevL||0)}</td>
<td>${s.r||0}</td>
<td>${(s.l||0)-(s.prevL||0)}</td>
<td>${(s.l||0)+(s.r||0)}</td>
</tr>
`
}

wBody.innerHTML += makeSum("강북도매 계",centers,"wireless")
wBody.innerHTML += makeSum("강북상권 계",["서대문","의정부","고양","구리","노원","광진"],"wireless")
wBody.innerHTML += makeSum("강원상권 계",["강릉","원주","춘천"],"wireless")

lBody.innerHTML += makeSum("강북도매 계",centers,"line")
lBody.innerHTML += makeSum("강북상권 계",["서대문","의정부","고양","구리","노원","광진"],"line")
lBody.innerHTML += makeSum("강원상권 계",["강릉","원주","춘천"],"line")

 let wPct=sum.tw?Math.round(sum.w/sum.tw*100):0
 let lPct=sum.tl?Math.round(sum.l/sum.tl*100):0

 pw.innerText=wPct+"%"
 pl.innerText=lPct+"%"

 rw.style.left=trackPos(wPct)+"%"
 rl.style.left=trackPos(lPct)+"%"

 updateTime()
}

function loadData(){
 db.ref().on("value",snap=>{
  cache=snap.val()||{}
  render()
 })
}

function save(){
 let s=getData(cur)
 db.ref("c_"+cur).update({
  prevW:s.w||0,prevL:s.l||0,
  w:Number(w.value||0),
  m:Number(m.value||0),
  l:Number(l.value||0),
  r:Number(r.value||0),
  ts:Date.now()
 })
 popup.style.display="none"
}

async function loadTarget(){

 const res = await fetch("target.xlsx?t=" + Date.now())
 const data = await res.arrayBuffer()
 const wb = XLSX.read(data)

 const ws = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1, raw:true})
const ls = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]],{header:1, raw:true})
 const now = new Date()
const tDay = now.getDate()
const tMonth = now.getMonth() + 1

let col = -1
let header = null

for(let r of ws){
  if(!r) continue

  let found = r.find(v =>
    typeof v === "number" || v instanceof Date
  )

  if(found){
    header = r
    break
  }
}

if(!header){
  alert("헤더 못찾음")
  return
}

const todayStr = `${tMonth}/${tDay}`

// 🔥 날짜 찾기 (단일 for문만)
for(let i=0;i<header.length;i++){
  let v = header[i]
  if(!v) continue

  let txt = ""

  if(typeof v === "number"){
  let d = XLSX.SSF.parse_date_code(v)
  if(d){
    txt = `${d.m}/${d.d}`
  }

} else if (v instanceof Date) {   // 🔥 여기에 들어가야 함
  txt = `${v.getMonth()+1}/${v.getDate()}`

} else {
  txt = String(v).trim()

  if(txt.includes("-")){
    let p = txt.split("-")
    if(p.length === 3){
      txt = `${Number(p[1])}/${Number(p[2])}`
    }
  }
  }

  if(txt === todayStr){
    col = i
    break
  }
}

// 🔥 여기부터는 반드시 for 밖

if(col === -1){
  alert("목표 날짜 매칭 실패")
  return
}

centers.forEach(c=>{
  let wr = ws.find(r=>r[0]===c)
  let lr = ls.find(r=>r[0]===c)

  targets[c] = {
    w: wr ? Number(wr[col] || 0) : 0,
    l: lr ? Number(lr[col] || 0) : 0
  }
})

targetLoaded = true
render()
}

renderBtns()
loadTarget().then(loadData)

function makeSummary(){

 let now = new Date()
 let timeTxt = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}시 기준`

 let arr = centers.map(c=>{
   let s=getData(c), t=targets[c]||{}

   let w = s.w||0, l = s.l||0
   let tw = t.w||0, tl = t.l||0

   let wPct = tw ? w/tw*100 : 0
   let lPct = tl ? l/tl*100 : 0

   let diffW = (s.w||0)-(s.prevW||0)
   let diffL = (s.l||0)-(s.prevL||0)

   return {
     c,
     w, l, tw, tl,
     wPct: Math.round(wPct*10)/10,
     lPct: Math.round(lPct*10)/10,
     diffW, diffL
   }
 })

 // 정렬
 let wRank = [...arr].sort((a,b)=>b.wPct-a.wPct)
 let lRank = [...arr].sort((a,b)=>b.lPct-a.lPct)

 // 전체 합계
 let sumW = arr.reduce((a,b)=>a+b.w,0)
 let sumL = arr.reduce((a,b)=>a+b.l,0)
 let sumTW = arr.reduce((a,b)=>a+b.tw,0)
 let sumTL = arr.reduce((a,b)=>a+b.tl,0)

 let totalWPct = sumTW ? Math.round(sumW/sumTW*1000)/10 : 0
 let totalLPct = sumTL ? Math.round(sumL/sumTL*1000)/10 : 0

 // 전체 증분
 let totalDiffW = arr.reduce((a,b)=>a+b.diffW,0)
 let totalDiffL = arr.reduce((a,b)=>a+b.diffL,0)

 let text = `[강북도매 유/무선 실적 요약 - ${timeTxt}]\n\n`

 // 🔥 무선
 text += `■ 무선 (전체 ${totalWPct}%, +${totalDiffW}건)\n\n`

 wRank.forEach((x,i)=>{
   text += `${i+1}위 ${x.c}: ${x.wPct}% (${x.tw}건/${x.w}건/${x.diffW>=0?`+${x.diffW}`:x.diffW}건)\n`
 })

 text += `\nㅇ무선 전체: ${sumW-totalDiffW}→${sumW}건 (+${totalDiffW}건)\n\n`

 // 🔥 유선
 text += `■ 유선 (전체 ${totalLPct}%, +${totalDiffL}건)\n\n`

 lRank.forEach((x,i)=>{
   text += `${i+1}위 ${x.c}: ${x.lPct}% (${x.tl}건/${x.l}건/${x.diffL>=0?`+${x.diffL}`:x.diffL}건)\n`
 })

 text += `\nㅇ유선 전체: ${sumL-totalDiffL}→${sumL}건 (+${totalDiffL}건)\n\n`

 // 🔥 핵심 요약 (자동)
 let topDiff = [...arr].sort((a,b)=>b.diffW-a.diffW)[0]
 let topL = [...arr].sort((a,b)=>b.lPct-a.lPct)[0]
 let zeroL = arr.filter(x=>x.l===0)

 text += "■ 핵심 요약\n"
 text += `- 무선: ${topDiff.c} ${topDiff.diffW>0?`+${topDiff.diffW}건 최다 증가`:"변동 없음"}\n`
 text += `- 유선: ${topL.c} ${topL.lPct}% 최고 달성\n`

 if(zeroL.length){
   text += `- 유선 무실적: ${zeroL.map(x=>x.c).join(", ")}\n`
 }

 return text
}
 
// 🔥 여기부터 붙여넣기
async function sendTelegram(){

 // 🔒 비밀번호 체크
 let pw = prompt("비밀번호 입력")
 if(pw !== ADMIN_PW){
   alert("비밀번호 틀림")
   return
 }

 let allDone = centers.every(c=>{
   let s=getData(c)
   return signal(s.ts)==="green"
 })

 if(!allDone){
   alert("아직 완료 안된 센터 있음")
   return
 }

 let area = document.getElementById("captureArea")

let canvas = await html2canvas(area, {
  scale: 1,
  useCORS: true
})
// 🔥 안정 방식 (이걸로 바꿔)
let blob = await new Promise(resolve=>{
  canvas.toBlob(function(b){
    if(!b){
      alert("❌ 캡쳐 실패")
      return
    }
    resolve(b)
  })
})

 let summary = makeSummary()
 const TOKEN = "8779626080:AAFnBI12T_W4XeWgIo9c2BKwI8qXi1rqMOw"
 const CHAT_ID = "-1003313981993"
 let form = new FormData()
 form.append("chat_id", CHAT_ID)
 form.append("photo", blob, "result.png")

 let res = await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`,{
  method:"POST",
  body:form
})

let result = await res.json()
await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
  method:"POST",
  headers:{
    "Content-Type":"application/json"
  },
  body: JSON.stringify({
    chat_id: CHAT_ID,
    text: summary
  })
})
console.log(result)

if(result.ok){
  alert("✅ 텔레 전송 성공")
}else{
  alert("❌ 전송 실패")
  console.log(result)
}

}  // 🔥 이게 핵심 (sendTelegram 닫기)

</script>

</body>
</html>
